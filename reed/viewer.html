<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<script>
try { const t = localStorage.getItem("reed-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
{{fonts}}
:root {
  color-scheme: light;
  --bg: #FFFEFA; --panel: #F4F3ED; --text: #252C2A; --muted: #5B655E; --faint: #8C948E; --line: #DEDFD8;
  --accent: #285F51; --accent-soft: #E1ECE7; --fixed: #805B10; --fixed-soft: #F4EAD2;
  --spare: #E9E8E1; --hilite: #FBEFC0;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
/* Dark twice: for the system setting (unless the reader chose light), and when chosen. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
  --bg: #181C19; --panel: #222923; --text: #E6E9E6; --muted: #C7CEC9; --faint: #89918B; --line: #39423B;
  --accent: #B7D7C8; --accent-soft: #2A3A33; --fixed: #E2CA8A; --fixed-soft: #3A3320;
  --spare: #2A312B; --hilite: #4A4217;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #181C19; --panel: #222923; --text: #E6E9E6; --muted: #C7CEC9; --faint: #89918B; --line: #39423B;
  --accent: #B7D7C8; --accent-soft: #2A3A33; --fixed: #E2CA8A; --fixed-soft: #3A3320;
  --spare: #2A312B; --hilite: #4A4217;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }

.app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
nav { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 14px 10px 40px; }
main { overflow: auto; padding: 20px 28px 60px; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; height: auto; }
  nav { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 16px; }
}

nav h1 { font-size: 15px; margin: 0 4px 2px; }
nav .sub { color: var(--muted); font-size: 12px; margin: 0 4px 10px; }
#filter { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--text); font: inherit; margin-bottom: 10px; }
.theme { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 0 0 12px; }
.theme button { flex: 1; border: 0; background: none; color: var(--muted); font: 12px var(--sans); padding: 4px 0; cursor: pointer; }
.theme button + button { border-left: 1px solid var(--line); }
.theme button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { margin-left: 11px; padding-left: 6px; border-left: 1px solid var(--line); }
.tree .row { display: flex; align-items: center; border-radius: 5px; }
.tree .row:hover { background: var(--line); }
.tree .tog { width: 22px; height: 26px; flex: none; border: 0; background: none; color: var(--muted); cursor: pointer;
  padding: 0; display: grid; place-items: center; border-radius: 4px; }
.tree .tog svg { width: 10px; height: 10px; transition: transform .12s; }
.tree li:not(.shut) > .row > .tog svg { transform: rotate(90deg); }
.tree span.tog { cursor: default; }
.tree span.tog::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--faint); }
.tree a { display: block; flex: 1; padding: 3px 6px 3px 2px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree a:hover { text-decoration: none; }
.tree .row.on { background: var(--accent-soft); }
.tree .row.on a { color: var(--accent); font-weight: 600; }
.tree li.shut > ul { display: none; }
.tree li.hidden { display: none; }
.tree .count { color: var(--muted); font-size: 11.5px; padding-right: 8px; }
.tree li.icd > .row a { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.tree li.icd { margin-top: 6px; }
.tree li.icd > ul { border-left: 0; margin-left: 4px; padding-left: 0; }

.crumbs { color: var(--muted); font-size: 12.5px; margin-bottom: 4px; }
h2 { font-size: 22px; margin: 0 0 4px; word-break: break-word; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); margin: 6px 0 4px; }
.facts b { color: var(--text); font-weight: 600; }
.doc { margin: 6px 0; max-width: 70ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chip { border-radius: 999px; padding: 1px 9px; font: 12px var(--mono); background: var(--panel); border: 1px solid var(--line); }
.chip.fixed { background: var(--fixed-soft); color: var(--fixed); border-color: transparent; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 8px; }
.index { margin: 0; padding-left: 18px; }
.index li { margin: 3px 0; }

.map { display: grid; gap: 2px; font: 11px var(--mono); max-width: 980px; }
.map .w { display: grid; grid-template-columns: 34px repeat(var(--bits), 1fr); gap: 2px; }
.map .n { color: var(--muted); text-align: right; padding-right: 6px; align-self: center; }
.map .hdr span { color: var(--muted); text-align: center; }
.map .seg { min-height: 26px; border-radius: 3px; padding: 4px 5px; overflow: hidden; white-space: nowrap;
  text-overflow: ellipsis; cursor: pointer; color: #1d1d1b; }
.map .seg.spare { background: repeating-linear-gradient(45deg, var(--spare), var(--spare) 4px, transparent 4px, transparent 8px);
  color: var(--muted); border: 1px solid var(--line); }
.map .seg.more { background: none; border: 1px dashed var(--line); color: var(--muted); cursor: default; }
.map .seg:hover:not(.more) { outline: 2px solid var(--accent); }

table.fields { border-collapse: separate; border-spacing: 0; width: 100%; max-width: 1200px; table-layout: fixed; }
col.c-word { width: 58px; } col.c-grp { width: 30px; } col.c-name { width: 190px; }
col.c-bits { width: 70px; } col.c-type { width: 30%; }
.fields th, .fields td { text-align: left; vertical-align: top; padding: 5px 10px;
  border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); }
.fields tr > :last-child { border-right: 1px solid var(--line); }
.fields th { font-size: 12px; color: var(--muted); font-weight: 600; position: sticky; top: -20px; z-index: 2;
  background: var(--panel); border-top: 1px solid var(--line); }
.fields td.word, .fields td.bits { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
.fields td.word { color: var(--muted); text-align: center; }
.fields td.name { overflow-wrap: anywhere; font-weight: 500; }
.fields td.type { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.fields td.grp { padding: 6px 0; background: var(--panel); }
.fields td.grp.k-case { background: var(--accent-soft); }
.fields td.grp > div { position: sticky; top: calc(var(--head, 30px) - 14px); margin: 0 auto; width: max-content;
  writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-weight: 600; font-size: 12.5px; }
.fields td.name .cap { display: block; font-size: 11.5px; font-weight: 600; color: var(--accent); }
.fields td.name .cap .what { font-weight: 400; font-family: var(--mono); }
.fields td.grp { cursor: pointer; }
.fields td.grp:hover { background: var(--line); }
.fields td.name .open { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 6px 0 0;
  font: inherit; vertical-align: middle; }
.fields td.name .open svg { width: 10px; height: 10px; }
.fields tr.collapsed td.name { font-weight: 600; }
.fields tr.collapsed td.name .what { font-weight: 400; color: var(--muted); font-family: var(--mono); font-size: 12px; margin-left: 6px; }
.fields tr.collapsed td { background: var(--panel); }
.fields-bar { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 8px; }
.fields-bar h3 { margin: 0; }
.fields-bar button { border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 5px;
  font: 12px var(--sans); padding: 2px 9px; cursor: pointer; }
.fields-bar button:hover { color: var(--text); border-color: var(--muted); }
.fields td.grp .what { font-weight: 400; color: var(--muted); font-family: var(--mono); font-size: 11.5px; margin-top: 6px; }
.fields td.grp.k-case .what { color: var(--accent); }
.fields tr.k-spare td.name, .fields tr.k-pad td.name, .fields tr.k-spare td.type, .fields tr.k-pad td.type { color: var(--muted); font-weight: 400; }
.fields tr.hilite td:not(.grp):not(.word) { background: var(--hilite); }
.map-vals { display: grid; grid-template-columns: max-content 1fr; gap: 1px 10px; }
.map-vals .v { color: var(--muted); text-align: right; }
.map-vals .on { background: var(--fixed-soft); color: var(--fixed); border-radius: 3px; padding: 0 3px; margin: 0 -3px; }
.fixed-val { display: inline-block; margin-top: 3px; }
.vals { display: flex; flex-wrap: wrap; gap: 4px; }
.vals .chip { font-size: 11.5px; }
.note { color: var(--muted); font-size: 12.5px; }
.empty { color: var(--muted); margin-top: 40px; }
</style>
</head>
<body>
<div class="app">
  <nav>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
    <div class="theme" role="group" aria-label="Colour scheme"></div>
    <input id="filter" type="search" placeholder="Filter messages…" aria-label="Filter messages">
    <div id="tree"></div>
  </nav>
  <main id="main"><p class="empty">Pick a message.</p></main>
</div>
<script id="icd-data" type="application/json">{{data}}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("icd-data").textContent);
const byKey = new Map();     // key -> {v, parent, icd}
const links = new Map();     // key -> nav <a>
let current = null;         // the variant shown

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid);
  return e;
}

function index(v, parent, icd) {
  byKey.set(v.key, {v, parent, icd});
  v.children.forEach(c => index(c, v, icd));
}
DATA.icds.forEach(icd => icd.messages.forEach(m => index(m, null, icd)));

// --- navigation ------------------------------------------------------------

const CHEVRON = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 1.5 L7 5 L3.5 8.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';

// A tree item: a chevron that opens and closes it (when it has children) and
// a link that shows it. Showing an item also opens it.
function treeItem(label, href, title, kids, cls) {
  const li = el("li", {class: cls});
  const a = el("a", {href, title, text: label});
  const row = el("div", {class: "row"});
  if (kids.length) {
    const b = el("button", {class: "tog", "aria-expanded": "false", "aria-label": "Open " + label,
      onclick: () => toggle(li)});
    b.innerHTML = CHEVRON;
    row.append(b, a, el("span", {class: "count", text: String(kids.length)}));
    li.classList.add("shut");
    li.append(row, el("ul", {}, kids));
  } else {
    row.append(el("span", {class: "tog"}), a);
    li.append(row);
  }
  return {li, a};
}

function navItem(v) {
  const {li, a} = treeItem(shortName(v), "#" + encodeURIComponent(v.key), v.name, v.children.map(navItem));
  li.dataset.name = v.name.toLowerCase();
  links.set(v.key, a);
  // An item with variants is a folder: its name opens and closes it.
  if (v.children.length) a.addEventListener("click", e => { e.preventDefault(); toggle(li); });
  return li;
}

function shortName(v) {
  const parts = v.name.split("/");
  return parts[parts.length - 1];
}

function toggle(li, open) {
  const shut = open === undefined ? !li.classList.contains("shut") : !open;
  li.classList.toggle("shut", shut);
  const b = li.querySelector(":scope > .row > button.tog");
  if (b) b.setAttribute("aria-expanded", String(!shut));
}

function buildNav() {
  document.getElementById("title").textContent = DATA.title;
  document.title = DATA.title;
  const count = [...byKey.values()].filter(e => !e.v.children.length).length;
  document.getElementById("sub").textContent =
    `${DATA.icds.length} ICD${DATA.icds.length === 1 ? "" : "s"} · ${count} variants · ${DATA.dialect} dialect`;
  const tree = document.getElementById("tree");
  const icds = DATA.icds.map(icd => {
    const label = icd.label || icd.namespace || "ICD";
    const {li, a} = treeItem(label, "#", icd.namespace, icd.messages.map(navItem), "icd");
    li.dataset.name = "";
    a.addEventListener("click", e => { e.preventDefault(); toggle(li); });
    toggle(li, true);
    return li;
  });
  tree.append(el("ul", {class: "tree"}, icds));
  themeSwitch();
  document.getElementById("filter").addEventListener("input", e => filter(e.target.value.trim().toLowerCase()));
}

function themeSwitch() {
  const box = document.querySelector(".theme");
  const root = document.documentElement;
  const set = choice => {
    if (choice === "auto") delete root.dataset.theme; else root.dataset.theme = choice;
    try { localStorage.setItem("reed-theme", choice); } catch (e) {}
    box.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.value === choice)));
  };
  for (const [value, text] of [["auto", "Auto"], ["light", "Light"], ["dark", "Dark"]]) {
    box.append(el("button", {type: "button", value, text, onclick: () => set(value)}));
  }
  set(root.dataset.theme || "auto");
}

function filter(text) {
  // Show items whose name matches, and their ancestors; open the ancestors.
  const visit = li => {
    const kids = [...li.querySelectorAll(":scope > ul > li")];
    const kidHit = kids.map(visit).some(Boolean);
    const hit = !text || li.dataset.name.includes(text) || kidHit;
    li.classList.toggle("hidden", !hit);
    if (text && kidHit) toggle(li, true);
    return hit;
  };
  document.querySelectorAll(".tree > li.icd > ul > li").forEach(visit);
}

function reveal(key) {
  links.forEach(a => a.parentElement.classList.remove("on"));
  const a = links.get(key);
  if (!a) return;
  a.parentElement.classList.add("on");
  for (let li = a.closest("li"); li; li = li.parentElement.closest("li")) toggle(li, true);
  a.scrollIntoView({block: "nearest"});
}

// --- the selected variant --------------------------------------------------

function show(key) {
  const entry = byKey.get(key);
  const main = document.getElementById("main");
  main.replaceChildren();
  if (!entry) { main.append(el("p", {class: "empty", text: "Pick a message."})); return; }
  const {v, icd} = entry;
  current = v;
  reveal(key);

  const chain = [];
  for (let p = entry.parent; p; p = byKey.get(p.key).parent) chain.unshift(p);
  main.append(el("div", {class: "crumbs"},
    el("span", {text: (icd.label || icd.namespace || "ICD") + " · "}),
    chain.flatMap(p => [el("a", {href: "#" + encodeURIComponent(p.key), text: shortName(p)}), " / "])));
  main.append(el("h2", {text: v.name}));
  if (v.children.length) { variantIndex(main, v); return; }
  main.append(el("div", {class: "facts"},
    el("span", {}, "size ", el("b", {text: v.size})),
    el("span", {}, "id ", el("b", {class: "mono", text: "(" + v.id + ")"})),
    el("span", {}, "words ", el("b", {text: v.word_bits + " bits"}))));
  if (v.label) main.append(el("p", {class: "doc", text: v.label}));
  if (v.description) main.append(el("p", {class: "doc", text: v.description}));
  if (v.consts.length) {
    main.append(el("div", {class: "chips"},
      v.consts.map(([path, value]) => el("span", {class: "chip fixed", title: "fixed in this variant",
        text: `${path} = ${fmt(value)}`}))));
  }
  const host = el("div");
  const draw = () => host.replaceChildren(fieldTable(v, draw));
  const containers = v.rows.filter(r => CONTAINERS.has(r.kind) && !r.hidden);
  main.append(el("div", {class: "fields-bar"},
    el("h3", {text: "Fields"}),
    el("button", {type: "button", text: "Collapse all", onclick: () => {
      const top = Math.min(...containers.map(r => r.depth));
      containers.filter(r => r.depth === top).forEach(r => collapsed.add(r.path));
      draw();
    }}),
    el("button", {type: "button", text: "Expand all", onclick: () => {
      containers.forEach(r => collapsed.delete(r.path));
      draw();
    }})));
  draw();
  main.append(host);
  main.append(el("h3", {text: "Bit map"}));
  main.append(bitMap(v));
  main.scrollTop = 0;
}

// A message (or variant) that splits further isn't a layout of its own: list
// its fully expanded variants instead.
function variantIndex(main, v) {
  const found = leaves(v);
  main.append(el("div", {class: "facts"},
    el("span", {}, "size ", el("b", {text: v.size})),
    el("span", {}, "id ", el("b", {class: "mono", text: "(" + v.id + ")"}))));
  if (v.label) main.append(el("p", {class: "doc", text: v.label}));
  if (v.description) main.append(el("p", {class: "doc", text: v.description}));
  main.append(el("h3", {text: `Variants (${found.length})`}));
  main.append(el("ul", {class: "index"}, found.map(c => el("li", {},
    el("a", {href: "#" + encodeURIComponent(c.key), text: c.name.slice(v.name.length + 1)}),
    c.label ? el("span", {class: "note", text: " — " + c.label}) : null))));
  main.scrollTop = 0;
}

function leaves(v) {
  return v.children.length ? v.children.flatMap(leaves) : [v];
}

function fmt(value) {
  return Array.isArray(value) ? "(" + value.map(fmt).join(", ") + ")" : String(value);
}

function place(row, wordBits) {
  if (row.offset == null) return "—";
  const w = Math.floor(row.offset / wordBits), b = row.offset % wordBits;
  return (row.relative ? "+" : "") + w + "." + String(b).padStart(2, "0");
}

function hue(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
}

function bitMap(v) {
  const W = v.word_bits;
  const tiles = v.rows.map((r, i) => [r, i]).filter(([r]) => r.map && r.kind !== "group");
  // Segments up to the first field whose size or offset isn't known.
  const segs = [];
  let end = 0, open = false;
  for (const [r, i] of tiles) {
    if (r.offset == null) { open = true; break; }
    if (r.bits == null) { segs.push({r, i, from: r.offset, to: null}); open = true; break; }
    segs.push({r, i, from: r.offset, to: r.offset + r.bits});
    end = r.offset + r.bits;
  }
  const map = el("div", {class: "map", style: `--bits:${W}`});
  const hdr = el("div", {class: "w hdr"}, el("span", {class: "n", text: "word"}));
  for (let c = 0; c < W; c++) {  // bit numbers MSB first, as in the table
    const b = W - 1 - c;
    hdr.append(el("span", {text: W <= 16 || b % 4 === 3 || b === 0 ? String(b) : ""}));
  }
  map.append(hdr);

  const last = segs.length ? segs[segs.length - 1] : null;
  const words = Math.max(1, Math.ceil((last && last.to == null ? last.from + 1 : end) / W));
  for (let w = 0; w < words; w++) {
    const line = el("div", {class: "w"}, el("span", {class: "n", text: String(w)}));
    const lo = w * W, hi = lo + W;
    for (const s of segs) {
      const to = s.to == null ? hi : s.to;
      const a = Math.max(s.from, lo), b = Math.min(to, hi);
      if (a >= b) continue;
      const spare = s.r.kind === "spare" || s.r.kind === "pad";
      const label = spare ? "spare" : s.r.kind === "union" ? s.r.name + " (union)" : s.r.name;
      const path = s.r.path || s.r.name;
      const seg = el("div", {
        class: "seg" + (spare ? " spare" : "") + (s.to == null ? " more" : ""),
        style: `grid-column:${a - lo + 2}/${b - lo + 2};` +
          (spare || s.to == null ? "" : `background:hsl(${hue(label)} 60% 78%)`),
        title: `${spare ? label : path}: ${s.r.type}, ${s.r.size}` + (s.r.offset != null ? ` at ${place(s.r, W)}` : ""),
        text: s.to == null ? label + " … (variable size)" : label,
        onclick: () => hilite(s.i),
      });
      line.append(seg);
    }
    map.append(line);
  }
  if (open && !(last && last.to == null)) {
    map.append(el("div", {class: "note", text: "…then fields of variable size; see the table."}));
  }
  return map;
}

function hilite(i) {
  document.querySelectorAll("tr.hilite").forEach(tr => tr.classList.remove("hilite"));
  const tr = document.getElementById("row-" + rowFor.get(i));
  if (tr) { tr.classList.add("hilite"); tr.scrollIntoView({block: "center", behavior: "smooth"}); }
}

const CONTAINERS = new Set(["group", "union", "case", "array"]);
const collapsed = new Set();  // paths of collapsed containers, kept across variants
const rowFor = new Map();     // row index -> index of the table row that shows it

// Groups, unions, cases and arrays become columns spanning the rows of their
// fields, with vertical labels that stay in view; fields are rows.
function fieldTable(v, redraw) {
  // A nestContents="false" container has no column: skip its (hidden) row.
  // A collapsed container is one row: skip what's inside it.
  const index = [], inside = new Set();  // collapsed containers
  let shut = null;
  rowFor.clear();
  v.rows.forEach((r, i) => {
    if (shut !== null && r.depth > v.rows[shut].depth) {
      rowFor.set(i, shut);
      return;
    }
    shut = null;
    if (r.hidden) return;
    index.push(i);
    rowFor.set(i, i);
    const next = v.rows[i + 1];
    if (CONTAINERS.has(r.kind) && collapsed.has(r.path) && next && next.depth > r.depth) {
      shut = i;
      inside.add(i);
    }
  });
  // A hidden row's bit-map segment points at the next row shown.
  for (let i = v.rows.length - 1, after = null; i >= 0; i--) {
    if (v.rows[i].hidden) { if (after !== null) rowFor.set(i, after); } else after = rowFor.get(i);
  }
  const rows = index.map(i => v.rows[i]);
  // How many field rows each container spans; an empty container is a field.
  const span = rows.map(() => 0);
  const leaf = rows.map((r, i) => !CONTAINERS.has(r.kind) ||
    !(i + 1 < rows.length && rows[i + 1].depth > r.depth));
  const open = [];
  rows.forEach((r, i) => {
    while (open.length && rows[open[open.length - 1]].depth >= r.depth) open.pop();
    if (leaf[i]) for (const j of open) span[j]++;
    else open.push(i);
  });
  const depth = Math.max(0, ...rows.filter((r, i) => leaf[i]).map(r => r.depth));

  // Field rows in the same word share a word cell, unless a new case starts.
  const fields = [];
  let pending = [], caseOf = [];
  rows.forEach((r, i) => {
    caseOf = caseOf.filter(c => rows[c].depth < r.depth);
    if (!leaf[i]) { pending.push(i); if (r.kind === "case") caseOf.push(i); return; }
    fields.push({i, starts: pending, scope: caseOf.length ? caseOf[caseOf.length - 1] : -1});
    pending = [];
  });
  fields.forEach((f, k) => {
    const prev = fields[k - 1];
    const same = prev && prev.scope === f.scope && !f.starts.some(j => rows[j].kind === "case") &&
      !inside.has(index[f.i]) && !inside.has(index[prev.i]) &&  // a collapsed row has its own word
      rows[prev.i].word === rows[f.i].word && rows[f.i].word !== "—";
    f.word = same ? 0 : 1;
    if (same) { let p = k - 1; while (!fields[p].word) p--; fields[p].word++; }
  });

  const body = el("tbody");
  for (const f of fields) {
    const r = rows[f.i];
    const tr = el("tr", {id: "row-" + index[f.i], class: "k-" + r.kind});
    if (f.word) tr.append(el("td", {class: "word", rowspan: f.word, text: r.word}));
    const fold = path => () => { collapsed.add(path); redraw(); };
    for (const j of f.starts) tr.append(groupCell(rows[j], span[j], fold(rows[j].path)));
    const spare = r.kind === "spare" || r.kind === "pad";
    const folded = inside.has(index[f.i]);
    let name = spare ? "spare" : r.name;
    if (folded) {
      tr.classList.add("collapsed");
      const b = el("button", {class: "open", type: "button", "aria-label": "Expand " + r.name,
        title: "Expand", onclick: () => { collapsed.delete(r.path); redraw(); }});
      b.innerHTML = CHEVRON;
      const what = groupWhat(r);
      name = [b, r.name, what && what !== r.name ? el("span", {class: "what", text: what}) : null];
    }
    tr.append(
      el("td", {class: "name", colspan: depth - r.depth + 1},
        f.starts.filter(j => span[j] === 1).map(j => caption(rows[j])), name),
      el("td", {class: "bits", text: r.bit_span, title: r.size}),
      el("td", {class: "type"}, folded ? (r.kind === "array" ? r.type : "") : typeCell(r)),
      el("td", {class: "desc"}, descCell(r)));
    body.append(tr);
  }
  const head = el("thead", {}, el("tr", {},
    el("th", {text: "word"}),
    el("th", {colspan: depth + 1, text: "field"}),
    el("th", {text: "bits"}), el("th", {text: "type"}), el("th", {text: "description"})));
  const table = el("table", {class: "fields"},
    el("colgroup", {},
      el("col", {class: "c-word"}),
      Array.from({length: depth}, () => el("col", {class: "c-grp"})),
      ["name", "bits", "type", "desc"].map(c => el("col", {class: "c-" + c}))),
    head, body);
  requestAnimationFrame(() => table.style.setProperty("--head", head.offsetHeight + "px"));
  return table;
}

function groupWhat(r) {
  return r.kind === "case" ? (r.case_value === "default" ? "default" : "= " + fmt(r.case_value))
    : r.kind === "union" ? r.type
    : r.kind === "array" ? r.type.replace("array ", "")
    : r.const != null ? "= " + fmt(r.const) : "";
}

function groupCell(r, rowspan, onclick) {
  const what = groupWhat(r);
  const title = [r.path, r.type, r.label, r.description, "Click to collapse"].filter(Boolean).join("\n");
  // One row has no room for a vertical label: the field's name cell captions it.
  const label = rowspan > 1 ? el("div", {}, r.name, what ? el("span", {class: "what", text: what}) : null) : null;
  return el("td", {class: "grp k-" + r.kind, rowspan, title, onclick}, label);
}

function caption(r) {
  return el("span", {class: "cap"}, r.name, " ", el("span", {class: "what", text: groupWhat(r)}), " ›");
}

function typeCell(r) {
  if (r.link && r.kind === "union") {  // another union's cases: link to them
    const [on, of] = r.type.split(": cases of ");
    return [on, el("br"), "cases of ", el("a", {href: "#" + encodeURIComponent(r.link), text: of})];
  }
  if (r.link) return el("a", {href: "#" + encodeURIComponent(r.link), text: "message " + r.link});
  if (r.values.length) {
    return el("div", {class: "map-vals", title: r.type + (r.restrict ? ", restricted" : "")},
      r.values.flatMap(([n, val]) => {
        const on = r.const === val ? " on" : "";
        return [el("span", {class: "v" + on, text: String(val)}), el("span", {class: on.trim(), text: n})];
      }));
  }
  const kids = [r.kind === "pad" ? "implicit spare" : r.type];
  if (r.const != null) kids.push(el("br"), el("span", {class: "chip fixed fixed-val", text: "= " + fmt(r.const)}));
  return kids;
}

function descCell(r) {
  const kids = [];
  if (r.label) kids.push(el("div", {}, el("b", {text: r.label})));
  if (r.description) kids.push(el("div", {text: r.description}));
  if (r.kind === "pad") kids.push(el("div", {class: "note", text: "pads the message to a whole word"}));
  if (r.default != null) {
    const named = r.values.find(([, val]) => val === r.default);
    kids.push(el("div", {class: "note", text: "default " + (named ? named[0] : r.default)}));
  }
  if (r.const != null && r.values.length) kids.push(el("div", {class: "note", text: "fixed in this variant"}));
  return kids;
}

// --- routing ---------------------------------------------------------------

function route() {
  const key = decodeURIComponent(location.hash.slice(1));
  if (byKey.has(key)) show(key);
  else if (DATA.icds.length && DATA.icds[0].messages.length) show(leaves(DATA.icds[0].messages[0])[0].key);
}

buildNav();
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
